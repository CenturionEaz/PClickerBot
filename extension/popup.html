<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PokéClicker Bot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <div class="popup-header">
      <div class="popup-logo"></div>
      <div>
        <div class="popup-title">POKÉCLICKER BOT</div>
        <div class="popup-sub">CYBER AUTOMATION SUITE</div>
      </div>
    </div>

    <div class="popup-status-badge active" id="bot-status-badge">
      <span class="badge-dot"></span>
      <span id="bot-status-text">EXTENSION ACTIVE</span>
    </div>

    <div class="popup-info">
      The automation overlay is loaded directly into the game window. Use the floating widget or in-game controls to customize all features.
    </div>

    <div class="popup-shortcuts">
      <div class="shortcut-item">
        <span class="key-badge">F2</span>
        <span>Toggle In-Game UI Overlay</span>
      </div>
      <div class="shortcut-item">
        <span class="key-badge">F4</span>
        <span>Master Bot Emergency Pause/Resume</span>
      </div>
    </div>

    <div class="popup-actions">
      <a href="https://www.pokeclicker.com" target="_blank" class="popup-btn">Open PokéClicker Web</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
